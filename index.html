<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Event Tracker</title>
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon-v5.png">
  <link rel="icon" type="image/png" href="./icon-192-v5.png">
  <link rel="manifest" href="./manifest-v5.webmanifest">
  <meta name="theme-color" content="#ffa500">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Event Pay">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="color-scheme" content="dark">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --bg: #090605;
      --card: #150e0c;
      --field: rgba(255, 255, 255, .045);
      --ink: #f6eee9;
      --mute: #a89890;
      --line: rgba(255, 255, 255, .08);
      --blue: #f06a38;
      --green: #55d79a;
      --greenbg: rgba(85, 215, 154, .13);
      --amber: #f3b24f;
      --amberbg: rgba(243, 178, 79, .14);
      --red: #ff7b6b;
      --redbg: rgba(255, 123, 107, .14);
      --grey: rgba(255, 255, 255, .07);
      --glass: linear-gradient(180deg, rgba(255, 255, 255, .055) 0%, rgba(255, 255, 255, .015) 100%), #140d0b;
      --glow: 0 10px 30px -12px rgba(240, 106, 56, .55);
      --r-card: 20px;
      --r-ctl: 14px;
      --font: "Urbanist", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif
    }

    * {
      box-sizing: border-box
    }

    html {
      background: var(--bg)
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font: 500 16px/1.5 var(--font);
      -webkit-font-smoothing: antialiased;
      font-variant-numeric: tabular-nums;
      background:
        radial-gradient(120% 55% at 50% -12%, rgba(150, 62, 30, .55) 0%, rgba(90, 36, 18, .22) 45%, transparent 75%),
        var(--bg);
      background-attachment: fixed
    }

    main {
      max-width: 960px;
      margin: 0 auto;
      padding: 28px 18px 72px
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 24px
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap
    }

    h1 {
      font: 700 1.7rem/1.1 var(--font);
      letter-spacing: -.02em;
      margin: 0
    }

    button,
    input,
    textarea {
      font: inherit
    }

    /* Buttons */
    .btn {
      border: 1px solid var(--line);
      background: var(--glass);
      color: var(--ink);
      padding: 9px 18px;
      border-radius: 999px;
      cursor: pointer;
      font-weight: 600;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .06);
      transition: border-color .15s, filter .15s, transform .08s
    }

    .btn:hover:not(:disabled) {
      border-color: rgba(255, 255, 255, .22)
    }

    .btn:active:not(:disabled) {
      transform: translateY(1px)
    }

    .btn:disabled {
      opacity: .4;
      cursor: not-allowed
    }

    .btn.primary {
      background: linear-gradient(180deg, #f77a45 0%, #e0562a 100%);
      border-color: rgba(255, 190, 160, .35);
      color: #fff;
      box-shadow: var(--glow), inset 0 1px 0 rgba(255, 255, 255, .25)
    }

    .btn.primary:hover:not(:disabled) {
      border-color: rgba(255, 210, 190, .6);
      filter: brightness(1.08)
    }

    .btn.good {
      background: linear-gradient(180deg, #3fc785 0%, #1f9a62 100%);
      border-color: rgba(160, 255, 210, .3);
      color: #04160e;
      box-shadow: 0 10px 26px -12px rgba(63, 199, 133, .6), inset 0 1px 0 rgba(255, 255, 255, .25)
    }

    .btn.good:hover:not(:disabled) {
      filter: brightness(1.08)
    }

    .btn.small {
      padding: 6px 14px;
      font-size: .88rem
    }

    .btn:focus-visible,
    input:focus-visible,
    textarea:focus-visible,
    .tabs button:focus-visible,
    .cal-day:focus-visible,
    summary:focus-visible {
      outline: 3px solid var(--blue);
      outline-offset: 2px
    }

    /* Dashboard */
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
      margin-bottom: 24px
    }

    .stat {
      background: var(--glass);
      border: 1px solid var(--line);
      border-radius: var(--r-card);
      padding: 16px 18px;
      display: flex;
      flex-direction: column-reverse;
      justify-content: flex-end;
      gap: 6px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .05)
    }

    .stat b {
      display: block;
      font: 700 1.5rem/1.15 var(--font);
      letter-spacing: -.01em
    }

    .stat span {
      color: var(--mute);
      font-size: .86rem;
      line-height: 1.35
    }

    .stat.owed {
      grid-column: span 2;
      padding: 22px 24px;
      justify-content: space-between;
      border-radius: 28px;
      border-color: rgba(255, 170, 130, .2);
      background:
        radial-gradient(80% 130% at 100% 0%, rgba(255, 140, 90, .38) 0%, transparent 60%),
        linear-gradient(155deg, #7a321d 0%, #43190f 52%, #1a0d09 100%);
      box-shadow: 0 24px 50px -24px rgba(240, 106, 56, .5), inset 0 1px 0 rgba(255, 255, 255, .12)
    }

    .stat.owed b {
      font-size: 2.7rem;
      line-height: 1.05;
      letter-spacing: -.03em;
      color: #fff
    }

    .stat.owed span {
      color: #e6c4b6;
      font-size: .92rem
    }

    .stat.paid b {
      color: var(--green)
    }

    .stat.short b {
      color: var(--red)
    }

    /* Filter tabs: one pill track */
    .tabs {
      display: flex;
      gap: 2px;
      margin-bottom: 14px;
      padding: 6px;
      overflow-x: auto;
      background: rgba(255, 255, 255, .04);
      border: 1px solid var(--line);
      border-radius: 999px;
      scrollbar-width: none
    }

    .tabs::-webkit-scrollbar {
      display: none
    }

    .tabs button {
      flex: none;
      border: 0;
      background: transparent;
      color: var(--mute);
      padding: 8px 16px;
      border-radius: 999px;
      cursor: pointer;
      font-weight: 600;
      font-size: .92rem;
      white-space: nowrap;
      transition: color .15s, background-color .15s
    }

    .tabs button:hover {
      color: var(--ink)
    }

    .tabs button[aria-pressed=true] {
      background: linear-gradient(180deg, #f77a45 0%, #e0562a 100%);
      color: #fff;
      box-shadow: var(--glow)
    }

    /* Bulk action bar */
    #bulk {
      justify-content: flex-start;
      margin: 0 0 16px;
      padding: 10px 12px;
      background: var(--glass);
      border: 1px solid var(--line);
      border-radius: var(--r-card);
      gap: 8px
    }

    #bulk .meta {
      margin-left: auto;
      font-weight: 600
    }

    /* Event cards */
    .ev {
      position: relative;
      background: var(--glass);
      border: 1px solid var(--line);
      border-radius: var(--r-card);
      padding: 18px 20px 16px 24px;
      margin-bottom: 12px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px 20px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .05), 0 14px 30px -22px #000
    }

    .ev::before {
      content: "";
      position: absolute;
      left: 9px;
      top: 18px;
      bottom: 18px;
      width: 4px;
      border-radius: 4px;
      background: var(--line)
    }

    .ev:has(.b-up)::before {
      background: var(--blue)
    }

    .ev:has(.b-wait)::before {
      background: var(--amber)
    }

    .ev:has(.b-paid)::before {
      background: var(--green)
    }

    .ev:has(.b-short)::before {
      background: var(--red)
    }

    .ev h3 {
      margin: 0 0 2px;
      font: 700 1.2rem/1.25 var(--font);
      letter-spacing: -.01em
    }

    .ev label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin: 4px 0 6px;
      font-size: .88rem;
      font-weight: 600;
      color: var(--mute);
      cursor: pointer
    }

    .ev input[type=checkbox] {
      width: 18px;
      height: 18px;
      padding: 0;
      accent-color: var(--blue)
    }

    .when {
      font-weight: 700
    }

    .meta {
      color: var(--mute);
      font-size: .92rem
    }

    .ev details {
      margin-top: 6px
    }

    .ev summary {
      cursor: pointer;
      width: fit-content;
      border-radius: 6px
    }

    .ev summary:hover {
      color: var(--ink)
    }

    .pay {
      text-align: right
    }

    .pay b {
      font: 700 1.5rem/1.2 var(--font);
      letter-spacing: -.02em
    }

    .pay .meta {
      font-size: .85rem;
      line-height: 1.5;
      margin-top: 2px
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 11px;
      border-radius: 999px;
      font-size: .8rem;
      font-weight: 700;
      margin-top: 8px
    }

    .badge::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor
    }

    .b-up {
      background: var(--grey);
      color: var(--mute)
    }

    .b-wait {
      background: var(--amberbg);
      color: var(--amber)
    }

    .b-paid {
      background: var(--greenbg);
      color: var(--green)
    }

    .b-short {
      background: var(--redbg);
      color: var(--red)
    }

    .acts {
      grid-column: 1/-1;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      border-top: 1px solid var(--line);
      padding-top: 12px;
      margin-top: 4px
    }

    .empty {
      background: transparent;
      border: 1.5px dashed rgba(255, 255, 255, .14);
      border-radius: var(--r-card);
      padding: 40px 24px;
      text-align: center;
      color: var(--mute)
    }

    /* Dialogs: bottom-sheet feel */
    dialog {
      position: fixed;
      border: 1px solid rgba(255, 255, 255, .1);
      border-radius: 28px;
      background:
        radial-gradient(90% 40% at 50% 0%, rgba(150, 62, 30, .35) 0%, transparent 70%),
        #120b09;
      color: var(--ink);
      width: min(520px, 94vw);
      max-height: 92vh;
      padding: 30px 24px 22px;
      box-shadow: 0 30px 70px -10px rgba(0, 0, 0, .8)
    }

    dialog::before {
      content: "";
      position: absolute;
      top: 10px;
      left: 50%;
      width: 40px;
      height: 4px;
      margin-left: -20px;
      border-radius: 4px;
      background: rgba(255, 255, 255, .22)
    }

    dialog::backdrop {
      background: rgba(4, 2, 1, .72);
      backdrop-filter: blur(4px)
    }

    dialog h2 {
      margin: 0 0 14px;
      text-align: center;
      font: 700 1.3rem/1.2 var(--font);
      letter-spacing: -.01em
    }

    label {
      display: block;
      font-size: .86rem;
      font-weight: 700;
      margin: 14px 0 5px
    }

    input,
    textarea {
      width: 100%;
      padding: 11px 14px;
      border: 1px solid var(--line);
      border-radius: var(--r-ctl);
      background: var(--field);
      color: var(--ink);
      transition: border-color .15s, background-color .15s
    }

    input::placeholder,
    textarea::placeholder {
      color: #7d6e67
    }

    input:hover,
    textarea:hover {
      border-color: rgba(255, 255, 255, .2)
    }

    input:focus,
    textarea:focus {
      border-color: var(--blue);
      background: rgba(240, 106, 56, .06)
    }

    textarea {
      resize: vertical;
      line-height: 1.45
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px
    }

    .foot {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 22px;
      padding-top: 16px;
      border-top: 1px solid var(--line)
    }

    .note {
      font-size: .9rem;
      margin-top: 10px;
      padding: 10px 14px;
      border-radius: var(--r-ctl);
      background: var(--grey)
    }

    .note:empty {
      display: none
    }

    .warn {
      color: var(--red)
    }

    .dayhint {
      color: var(--mute);
      font-size: .86rem;
      margin-top: 5px
    }

    #eventTotal {
      color: var(--ink);
      font-weight: 700
    }

    #allocations {
      margin-top: 12px
    }

    #allocations .meta {
      padding: 6px 0;
      border-top: 1px solid var(--line)
    }

    /* Calendar */
    .calendar-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin: 16px 0;
      flex-wrap: wrap
    }

    .calendar-head h2 {
      margin: 0;
      font: 700 1.3rem/1.2 var(--font);
      letter-spacing: -.01em
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 6px
    }

    .weekday {
      text-align: center;
      color: var(--mute);
      font-size: .8rem;
      font-weight: 700;
      padding: 6px
    }

    .cal-day {
      min-height: 96px;
      padding: 8px 7px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--glass);
      color: var(--ink);
      cursor: pointer;
      text-align: left;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      gap: 2px;
      transition: border-color .15s
    }

    .cal-day:hover {
      border-color: rgba(255, 255, 255, .24)
    }

    .cal-day strong {
      font: 700 .95rem/1 var(--font);
      min-width: 26px;
      height: 26px;
      display: inline-grid;
      place-items: center;
      align-self: flex-start;
      margin-bottom: 2px
    }

    .cal-day.has-events {
      border-color: rgba(240, 106, 56, .45);
      background:
        linear-gradient(180deg, rgba(240, 106, 56, .2) 0%, rgba(240, 106, 56, .05) 100%), #140d0b
    }

    .cal-day.selected {
      outline: 2px solid var(--blue);
      outline-offset: -1px
    }

    .cal-day.today strong {
      background: var(--blue);
      color: #fff;
      border-radius: 50%
    }

    .cal-day small {
      display: block;
      font-size: .72rem;
      line-height: 1.3;
      color: var(--mute);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    .cal-day small:first-of-type {
      color: #ff9a6e;
      font-weight: 700
    }

    .calendar-summary {
      margin: 12px 0 16px;
      padding: 12px 16px;
      background: var(--glass);
      border: 1px solid var(--line);
      border-radius: var(--r-ctl);
      color: var(--mute);
      font-size: .9rem
    }

    .cal-blank {
      min-height: 96px
    }

    .calendar-details {
      margin-top: 18px
    }

    #calendar h3 {
      margin: 20px 0 10px;
      font: 700 1.1rem/1.3 var(--font)
    }

    @media(max-width:640px) {
      main {
        padding: 20px 14px 60px
      }

      h1 {
        font-size: 1.45rem
      }

      .stat.owed {
        grid-column: 1/-1
      }

      .stat.owed b {
        font-size: 2.3rem
      }

      #bulk .meta {
        margin-left: 0;
        width: 100%
      }
    }

    @media(max-width:540px) {

      .cal-day,
      .cal-blank {
        min-height: 76px
      }

      .cal-day {
        padding: 6px 4px;
        border-radius: 12px
      }

      .calendar-grid {
        gap: 3px
      }

      .cal-day small {
        font-size: .63rem
      }

      .ev {
        grid-template-columns: 1fr
      }

      .pay {
        text-align: left
      }

      dialog {
        width: 100vw;
        max-width: 100vw;
        margin: auto 0 0;
        border-radius: 28px 28px 0 0;
        padding: 30px 18px 20px
      }
    }

    @media(prefers-reduced-motion:reduce) {

      *,
      *::before,
      *::after {
        transition: none !important
      }
    }

    /* Icons, brand and quick actions */
    .ic {
      width: 18px;
      height: 18px;
      flex: none;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.9;
      stroke-linecap: round;
      stroke-linejoin: round
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px
    }

    .logo {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: #fff;
      background: radial-gradient(circle at 30% 25%, #ff9a6e 0%, #d4501f 55%, #7a2a14 100%);
      box-shadow: var(--glow), inset 0 1px 0 rgba(255, 255, 255, .35)
    }

    .logo .ic {
      width: 22px;
      height: 22px
    }

    .quick {
      display: flex;
      gap: 22px;
      margin: -4px 0 22px
    }

    .qa {
      appearance: none;
      background: none;
      border: 0;
      padding: 0;
      color: var(--ink);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      width: 76px;
      font-weight: 600;
      font-size: .8rem;
      line-height: 1.2;
      text-align: center
    }

    .qa-ico {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255, 255, 255, .16);
      background: var(--glass);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .08);
      transition: transform .1s, border-color .15s
    }

    .qa-ico .ic {
      width: 22px;
      height: 22px
    }

    .qa-ico.hot {
      background: linear-gradient(180deg, #f77a45 0%, #e0562a 100%);
      border-color: rgba(255, 190, 160, .4);
      color: #fff;
      box-shadow: var(--glow), inset 0 1px 0 rgba(255, 255, 255, .25)
    }

    .qa:hover .qa-ico {
      border-color: rgba(255, 255, 255, .4)
    }

    .qa:active .qa-ico {
      transform: scale(.94)
    }

    .qa:focus-visible {
      outline: 3px solid var(--blue);
      outline-offset: 4px;
      border-radius: 16px
    }

    .btn .ic {
      width: 16px;
      height: 16px;
      margin: -2px 6px -2px -2px;
      vertical-align: middle
    }

    .btn.icon {
      width: 42px;
      height: 42px;
      padding: 0;
      display: inline-grid;
      place-items: center
    }

    .btn.icon .ic {
      margin: 0;
      width: 18px;
      height: 18px
    }

    .btn.small[data-a=del]:hover {
      color: var(--red);
      border-color: var(--red)
    }

    .ev h3 {
      display: flex;
      align-items: center;
      gap: 10px
    }

    .ico {
      width: 34px;
      height: 34px;
      flex: none;
      border-radius: 50%;
      display: grid;
      place-items: center;
      border: 1px solid var(--line)
    }

    .ico.b-up {
      background: rgba(240, 106, 56, .14);
      color: var(--blue)
    }

    @media(max-width:540px) {
      .quick {
        justify-content: space-between;
        gap: 8px
      }

      .qa {
        flex: 1;
        width: auto
      }
    }

    /* Floating bottom bar for Export / Add / Import */
    main {
      padding-bottom: 130px
    }

    .quick {
      position: fixed;
      left: 50%;
      bottom: calc(14px + env(safe-area-inset-bottom, 0px));
      transform: translateX(-50%);
      z-index: 20;
      width: min(400px, calc(100% - 28px));
      margin: 0;
      padding: 10px 14px 8px;
      gap: 0;
      justify-content: space-around;
      align-items: flex-end;
      border-radius: 32px;
      border: 1px solid rgba(255, 255, 255, .1);
      background: rgba(22, 13, 10, .82);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 18px 40px -10px rgba(0, 0, 0, .8), inset 0 1px 0 rgba(255, 255, 255, .06)
    }

    .quick .qa {
      flex: 1;
      width: auto;
      gap: 5px;
      font-size: .72rem;
      color: var(--mute)
    }

    .quick .qa-ico {
      width: 44px;
      height: 44px;
      background: transparent;
      border-color: transparent;
      box-shadow: none
    }

    .quick .qa:hover {
      color: var(--ink)
    }

    .quick .qa-ico.hot {
      width: 58px;
      height: 58px;
      margin-top: -22px;
      border: 3px solid rgba(255, 190, 160, .55);
      background: linear-gradient(180deg, #f77a45 0%, #e0562a 100%)
    }

    .quick .qa:has(.hot) {
      color: var(--ink)
    }

    @media(max-width:540px) {
      .quick {
        justify-content: space-around;
        gap: 0
      }
    }
  </style>
</head>

<body>
  <main>
    <header>
      <div class="brand">
        <span class="logo"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7.5A2.5 2.5 0 0 1 6.5 5H18v3"/><path d="M4 7.5V17a2 2 0 0 0 2 2h12a1 1 0 0 0 1-1v-9a1 1 0 0 0-1-1H6.5A2.5 2.5 0 0 1 4 7.5z"/><circle cx="15.5" cy="13.5" r="1.1"/></svg></span>
        <h1>Event Tracker</h1>
      </div>
    </header>

    <section class="stats" id="stats"></section>

    <nav class="quick" aria-label="Quick actions">
      <button class="qa" id="exp"><span class="qa-ico"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v12m0 0-4-4m4 4 4-4M5 20h14"/></svg></span><span class="qa-lbl">Export backup</span></button>
      <button class="qa" id="add"><span class="qa-ico hot"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span><span class="qa-lbl">Add event</span></button>
      <button class="qa" id="imp"><span class="qa-ico"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4m0 0L8 8m4-4 4 4M5 20h14"/></svg></span><span class="qa-lbl">Import</span></button>
      <input type="file" id="file" accept=".json" hidden>
    </nav>
    <div class="tabs" id="tabs"></div>
    <section id="calendar" hidden></section>
    <div id="bulk" class="calendar-head"></div>
    <section id="list"></section>
  </main>

  <dialog id="form">
    <form method="dialog" id="f">
      <h2 id="ftitle">Add event</h2>
      <label for="pasteInfo">Paste event information</label>
      <textarea id="pasteInfo" rows="5" placeholder="Paste the event message here to auto-fill the fields below."></textarea>
      <div class="dayhint" id="pasteResult" role="status" aria-live="polite">Fields fill automatically. Review them
        before saving.</div>
      <label for="date">Date</label>
      <input type="date" id="date" required>
      <div class="dayhint" id="day"></div>
      <div class="row">
        <div><label for="start">Start time</label><input type="time" id="start" required></div>
        <div><label for="end">End time</label><input type="time" id="end" required></div>
      </div>
      <label for="salary">Salary for this event (RM)</label>
      <input type="number" id="salary" min="0" step="0.01" required>
      <label for="allowance">Allowance for this event (RM)</label>
      <input type="number" id="allowance" min="0" step="0.01" value="0">
      <div class="row">
        <div><label for="ot">Overtime pay (RM, optional)</label><input type="number" id="ot" min="0" step="0.01"
            value="0"></div>
        <div><label for="parking">Parking claim (RM, optional)</label><input type="number" id="parking" min="0"
            step="0.01" value="0"></div>
      </div>
      <div class="dayhint">Enter the total overtime amount and parking reimbursement to claim. Leave 0 when not
        applicable.</div>
      <div class="dayhint" id="eventTotal"></div>
      <label for="loc">Location name</label>
      <input id="loc" required placeholder="e.g. Pavilion Hall">
      <label for="addr">Address</label>
      <input id="addr" placeholder="Street, city">
      <div class="foot">
        <button type="button" class="btn" id="cancel">Cancel</button>
        <button class="btn primary" type="submit">Save event</button>
      </div>
    </form>
  </dialog>

  <dialog id="payd">
    <form method="dialog" id="pf">
      <h2>Record company payment</h2>
      <div class="meta" id="pinfo"></div>
      <label for="pdate">Date received</label>
      <input type="date" id="pdate" required>
      <label for="pamt">Amount you received (RM)</label>
      <input type="number" id="pamt" min="0.01" step="0.01" required>
      <div class="note" id="pcheck" role="status" aria-live="polite"></div>
      <div id="allocations"></div>
      <div class="foot">
        <button type="button" class="btn" id="pcancel">Cancel</button>
        <button class="btn good" type="submit">Save payment</button>
      </div>
    </form>
  </dialog>

  <script>
    const KEY = 'eventPayTracker.v1';
    const $ = id => document.getElementById(id);
    const DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
    let events = [], filter = 'all', editId = null, payId = null;
    const selectedEvents = new Set();
    let paymentIds = [];
    const cents = n => Math.round(Number(n || 0) * 100);
    const ownPayments = e => Array.isArray(e.payments) ? e.payments : e.paid ? [{ amount: Number(e.paid.amount), date: e.paid.date }] : [];
    const groupOf = e => e.paymentGroup ? (events.find(x => x.paymentGroup?.id === e.paymentGroup.id)?.paymentGroup || e.paymentGroup) : null;
    const members = e => { const g = groupOf(e); return g ? events.filter(x => x.paymentGroup?.id === g.id) : [e]; };
    const payments = e => groupOf(e)?.payments || ownPayments(e);
    const received = e => payments(e).reduce((n, p) => n + cents(p.amount), 0) / 100;
    const expected = e => members(e).reduce((n, x) => n + cents(totalPay(x)), 0) / 100;
    const balance = e => Math.max(0, cents(expected(e)) - cents(received(e))) / 100;
    const uniqueUnits = items => [...new Map(items.map(e => [groupOf(e)?.id || 'event:' + e.id, e])).values()];
    const sumBalances = items => uniqueUnits(items).reduce((n, e) => n + cents(balance(e)), 0) / 100;
    function selectUnit(e, checked) { members(e).forEach(x => checked ? selectedEvents.add(x.id) : selectedEvents.delete(x.id)); }
    function writeGroup(g) { events.forEach(e => { if (e.paymentGroup?.id === g.id) e.paymentGroup = g; }); }
    let calendarMonth = new Date(new Date().getFullYear(), new Date().getMonth(), 1), selectedDate = null;
    const totalPay = e => Math.round((Number(e.salary || 0) + Number(e.allowance || 0) + Number(e.ot || 0) + Number(e.parking || 0)) * 100) / 100;

    try { events = JSON.parse(localStorage.getItem(KEY) || '[]'); } catch (e) { events = []; }
    function save() { try { localStorage.setItem(KEY, JSON.stringify(events)); } catch (e) { alert('Could not save in this browser. Use Export backup.'); } }

    const rm = n => 'RM ' + Number(n).toLocaleString('en-MY', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
    const dayName = ds => ds ? DAYS[new Date(ds + 'T00:00').getDay()] : '';
    const fmtDate = ds => new Date(ds + 'T00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
    const fmtTime = t => { const [h, m] = t.split(':').map(Number); return ((h % 12) || 12) + ':' + String(m).padStart(2, '0') + ' ' + (h < 12 ? 'AM' : 'PM'); };
    const esc = s => String(s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    const IC = n => `<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${{
      cal: '<rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/>',
      clock: '<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>',
      check: '<path d="m5 12.5 4.5 4.5L19 7.5"/>',
      alert: '<circle cx="12" cy="12" r="8.5"/><path d="M12 8v5M12 16.2v.1"/>',
      inb: '<path d="M17 7 7 17m0 0V9m0 8h8"/>',
      edit: '<path d="M4 20h4L19 9l-4-4L4 16z"/>',
      trash: '<path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13"/>',
      left: '<path d="m15 6-6 6 6 6"/>',
      right: '<path d="m9 6 6 6-6 6"/>'
    }[n]}</svg>`;
    function status(e) {
      if (payments(e).length) return balance(e) > 0 ? 'short' : 'paid';
      const end = new Date(e.date + 'T' + e.end);
      return end < new Date() ? 'wait' : 'up';
    }

    function render() {
      const s = events.map(e => ({ ...e, st: status(e) }));
      const owed = s.filter(e => e.st === 'wait');
      const upc = s.filter(e => e.st === 'up');
      const month = today().slice(0, 7);
      const paidM = uniqueUnits(s).reduce((n, e) => n + payments(e).filter(p => p.date.slice(0, 7) === month).reduce((a, p) => a + cents(p.amount), 0), 0) / 100;
      const shorts = s.filter(e => e.st === 'short');
      const diff = sumBalances(shorts);
      const outstanding = s.filter(e => e.st === 'short' || e.st === 'wait');

      $('stats').innerHTML =
        `<div class="stat owed"><b>${rm(sumBalances(owed))}</b><span>Waiting to be paid (${owed.length} done events)</span></div>
     <div class="stat"><b>${rm(upc.reduce((a, e) => a + totalPay(e), 0))}</b><span>Upcoming (${upc.length} events)</span></div>
     <div class="stat paid"><b>${rm(paidM)}</b><span>Received this month</span></div>` +
        (shorts.length ? `<div class="stat short"><b>${rm(Math.abs(diff))}</b><span>Company still owes you · ${shorts.length} event(s)</span></div>` : '');

      const salaryTotal = s.reduce((a, e) => a + Number(e.salary || 0), 0), allowanceTotal = s.reduce((a, e) => a + Number(e.allowance || 0) + Number(e.ot || 0) + Number(e.parking || 0), 0);
      $('stats').innerHTML += `<div class="stat"><b>${rm(salaryTotal)}</b><span>Total salary · all events</span></div><div class="stat"><b>${rm(allowanceTotal)}</b><span>Total allowance · includes OT + parking</span></div><div class="stat"><b>${rm(s.reduce((n, e) => n + totalPay(e), 0))}</b><span>Total expected · salary + allowance + OT + parking</span></div>`;
      const tabs = [['calendar', 'Calendar', s.length], ['all', 'All', s.length], ['up', 'Upcoming', upc.length], ['wait', 'Waiting for pay', owed.length], ['short', 'Underpaid', shorts.length], ['outstanding', 'Outstanding', outstanding.length], ['paid', 'Paid in full', s.filter(e => e.st === 'paid').length]];
      $('tabs').innerHTML = tabs.map(t => `<button aria-pressed="${filter === t[0]}" data-f="${t[0]}">${t[1]} (${t[2]})</button>`).join('');

      $('calendar').hidden = filter !== 'calendar';
      if (filter === 'calendar') renderCalendar();
      let list = s.filter(e => (filter === 'calendar' ? e.date === selectedDate : filter === 'all') || (filter === 'outstanding' ? e.st === 'wait' || e.st === 'short' : e.st === filter));
      list.sort((a, b) => filter === 'paid' || filter === 'all' && false ? b.date.localeCompare(a.date) : a.date.localeCompare(b.date) || a.start.localeCompare(b.start));

      if (filter === 'short' || filter === 'outstanding') list.sort((a, b) => (groupOf(a)?.id || a.id).localeCompare(groupOf(b)?.id || b.id));
      for (const id of selectedEvents) if (!events.some(e => e.id === id && balance(e) > 0)) selectedEvents.delete(id);
      $('bulk').innerHTML = `<button class="btn" id="selectVisible">Select unpaid events in this view</button><button class="btn" id="clearSelection">Clear selection</button><button class="btn primary" id="bulkPay" ${selectedEvents.size ? '' : 'disabled'}>Record payment (${selectedEvents.size} selected)</button><span class="meta">Selected balance: ${rm(sumBalances(events.filter(e => selectedEvents.has(e.id))))}</span>`;
      $('selectVisible').onclick = () => { list.filter(e => balance(e) > 0).forEach(e => selectUnit(e, true)); render(); };
      $('clearSelection').onclick = () => { selectedEvents.clear(); render(); };
      $('bulkPay').onclick = () => openPayment([...selectedEvents]);
      if (!list.length) {
        $('list').innerHTML = `<div class="empty">${s.length ? (filter === 'calendar' ? 'Select an event date above to see its details.' : 'No events in this view.') : 'No events yet. Press “Add event” to record your first one.'}</div>`;
        return;
      }
      const badge = { up: ['b-up', 'Upcoming'], wait: ['b-wait', 'Event done · waiting for pay'], paid: ['b-paid', 'Paid'], short: ['b-short', 'Part paid · balance owed'] };
      $('list').innerHTML = list.map(e => {
        const b = badge[e.st];
        const g = groupOf(e);
        const groupLabel = g ? `Shared payment · ${members(e).length} events · ` : '';
        const paidLine = payments(e).length || g ? `<div class="meta">${groupLabel}Received ${rm(received(e))} · ${balance(e) > 0 ? `<strong class="warn">${g ? 'This group is still owed' : 'Company owes'} ${rm(balance(e))}</strong>` : 'Paid in full'}${received(e) > expected(e) ? ` · Extra received ${rm(received(e) - expected(e))}` : ''}</div>${g ? `<div class="dayhint">${members(e).map(x => esc(x.loc) + ' (' + fmtDate(x.date) + ')').join(' + ')}. Shared balance counted once on dashboard.</div>` : ''}<details><summary class="meta">${g ? 'Group payment' : 'Payment'} history</summary>${payments(e).map(p => `<div class="meta">${fmtDate(p.date)} · ${rm(p.amount)}</div>`).join('')}</details>` : '';
        return `<article class="ev">
      <div>
        <h3><span class="ico ${b[0]}">${IC({ up: 'cal', wait: 'clock', paid: 'check', short: 'alert' }[e.st])}</span><span>${esc(e.loc)}</span></h3>${balance(e) > 0 ? `<label><input type="checkbox" style="width:auto" data-select="${esc(e.id)}" ${selectedEvents.has(e.id) ? 'checked' : ''}> Select for payment</label>` : ''}
        <div class="when">${dayName(e.date)}, ${fmtDate(e.date)} · ${fmtTime(e.start)} – ${fmtTime(e.end)}</div>
        <div class="meta">${esc(e.addr) || 'No address'}</div>
        ${paidLine}
      </div>
      <div class="pay"><b>${rm(totalPay(e))}</b><div class="meta">Salary ${rm(e.salary)}<br>Allowance ${rm(e.allowance || 0)}<br>OT ${rm(e.ot || 0)}<br>Parking claim ${rm(e.parking || 0)}</div><span class="badge ${b[0]}">${b[1]}</span></div>
      <div class="acts">
        ${balance(e) > 0 ? `<button class="btn small good" data-a="pay" data-id="${esc(e.id)}">${IC('inb')}${payments(e).length ? 'Receive remaining balance' : 'Record payment'}</button>` : ''}
        <button class="btn small" data-a="edit" data-id="${e.id}">${IC('edit')}Edit</button>
        <button class="btn small" data-a="del" data-id="${e.id}">${IC('trash')}Delete</button>
      </div>
    </article>`;
      }).join('');
    }


    function updateEventTotal() {
      $('eventTotal').textContent = 'Total expected pay: ' + rm(Number($('salary').value || 0) + Number($('allowance').value || 0) + Number($('ot').value || 0) + Number($('parking').value || 0));
    }
    $('salary').addEventListener('input', updateEventTotal);
    $('allowance').addEventListener('input', updateEventTotal);
    $('ot').addEventListener('input', updateEventTotal);
    $('parking').addEventListener('input', updateEventTotal);
    function renderCalendar() {
      const y = calendarMonth.getFullYear(), m = calendarMonth.getMonth();
      const monthKey = y + '-' + String(m + 1).padStart(2, '0');
      const monthly = events.filter(e => e.date.slice(0, 7) === monthKey);
      const cells = [];
      for (let i = 0; i < new Date(y, m, 1).getDay(); i++) cells.push('<div class="cal-blank"></div>');
      for (let d = 1; d <= new Date(y, m + 1, 0).getDate(); d++) {
        const ds = monthKey + '-' + String(d).padStart(2, '0'), entries = monthly.filter(e => e.date === ds).sort((a, b) => a.start.localeCompare(b.start));
        cells.push(`<button class="cal-day ${entries.length ? 'has-events' : ''} ${ds === today() ? 'today' : ''} ${ds === selectedDate ? 'selected' : ''}" data-date="${ds}" aria-label="${ds}: ${entries.length} events" aria-pressed="${ds === selectedDate}"><strong>${d}</strong>${entries.length ? `<small>${entries.length} event${entries.length === 1 ? '' : 's'}</small>` : ''}${entries.slice(0, 2).map(e => `<small>${esc(e.start)} ${esc(e.loc)}</small>`).join('')}${entries.length > 2 ? '<small>+ more</small>' : ''}</button>`);
      }
      $('calendar').innerHTML = `<div class="calendar-head"><button class="btn icon" data-month="-1" aria-label="Previous month">${IC('left')}</button><h2>${calendarMonth.toLocaleDateString('en-GB', { month: 'long', year: 'numeric' })}</h2><button class="btn icon" data-month="1" aria-label="Next month">${IC('right')}</button><button class="btn" data-today>Today</button></div><div class="calendar-summary">${monthly.length} events · Salary ${rm(monthly.reduce((a, e) => a + Number(e.salary), 0))} · Allowance ${rm(monthly.reduce((a, e) => a + Number(e.allowance || 0), 0))} · OT ${rm(monthly.reduce((n, e) => n + Number(e.ot || 0), 0))} · Parking ${rm(monthly.reduce((n, e) => n + Number(e.parking || 0), 0))} · Total ${rm(monthly.reduce((a, e) => a + totalPay(e), 0))}</div><div class="calendar-grid">${['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].map(d => `<div class="weekday">${d}</div>`).join('')}${cells.join('')}</div><h3>${selectedDate ? dayName(selectedDate) + ', ' + fmtDate(selectedDate) : 'Event details'}</h3>`;
    }
    $('calendar').addEventListener('click', ev => {
      const b = ev.target.closest('button'); if (!b) return;
      if (b.dataset.month) { calendarMonth = new Date(calendarMonth.getFullYear(), calendarMonth.getMonth() + Number(b.dataset.month), 1); selectedDate = null; }
      if (b.hasAttribute('data-today')) { const d = new Date(); calendarMonth = new Date(d.getFullYear(), d.getMonth(), 1); selectedDate = today(); }
      if (b.dataset.date) selectedDate = b.dataset.date;
      render();
    });


    /* Parse recruitment messages locally; only identified fields are filled. */
    function parseEventMessage(text) {
      const out = {}, months = ['january', 'february', 'march', 'april', 'may', 'june', 'july', 'august', 'september', 'october', 'november', 'december'];
      const dm = text.match(/\b(\d{1,2})(?:st|nd|rd|th)?\s+([a-z]+)\s+(\d{4})\b/i);
      if (dm) {
        const month = months.findIndex(m => m === dm[2].toLowerCase() || m.slice(0, 3) === dm[2].toLowerCase());
        const d = new Date(Number(dm[3]), month, Number(dm[1]));
        if (month >= 0 && d.getMonth() === month && d.getDate() === Number(dm[1])) out.date = dm[3] + '-' + String(month + 1).padStart(2, '0') + '-' + dm[1].padStart(2, '0');
      }
      function timeValue(raw, meridiem) {
        let h, m;
        if (raw.includes(':')) [h, m] = raw.split(':').map(Number);
        else if (raw.length > 2) { h = Number(raw.slice(0, -2)); m = Number(raw.slice(-2)); }
        else { h = Number(raw); m = 0; }
        if (m > 59 || (meridiem ? h < 1 || h > 12 : h > 23)) return null;
        if (meridiem) h = h % 12 + (meridiem.toLowerCase() === 'pm' ? 12 : 0);
        return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0');
      }
      const tm = text.match(/\b(\d{1,4}(?::\d{2})?)\s*(am|pm)?\s*(?:to|[-–—])\s*(\d{1,4}(?::\d{2})?)\s*(am|pm)\b/i);
      if (tm) {
        const start = timeValue(tm[1], tm[2] || tm[4]), end = timeValue(tm[3], tm[4]);
        if (start) out.start = start; if (end) out.end = end;
      }
      const money = [...text.matchAll(/RM\s*([\d,]+(?:\.\d{1,2})?)([^\n\r+]*)(?:\+)?/gi)];
      for (const match of money) {
        const amount = Number(match[1].replace(/,/g, ''));
        if (!Number.isFinite(amount)) continue;
        if (/allowance/i.test(match[2])) out.allowance = (out.allowance || 0) + amount;
        else if (out.salary === undefined) out.salary = amount;
      }
      if (out.salary !== undefined && out.allowance === undefined) out.allowance = 0;
      const lines = text.split(/\r?\n/).map(l => l.trim());
      const idx = lines.findIndex(l => /📍|^(?:event\s+)?(?:location|venue)\s*:/i.test(l));
      if (idx >= 0) {
        out.loc = lines[idx].replace(/^.*?📍\s*|^(?:event\s+)?(?:location|venue)\s*:\s*/i, '').trim();
        const addr = [];
        for (let i = idx + 1; i < lines.length; i++) {
          const l = lines[i];
          if (!l || /💰|RM\s*\d|vacancy|meeting\s+location|gather\s*point|payment|allowance|https?:\/\//i.test(l)) break;
          addr.push(l.replace(/^address\s*:\s*/i, ''));
        }
        if (addr.length) out.addr = addr.join(', ');
      }
      return out;
    }
    $('pasteInfo').addEventListener('input', () => {
      const text = $('pasteInfo').value;
      if (!text.trim()) { $('pasteResult').textContent = 'Fields fill automatically. Review them before saving.'; return; }
      const fields = parseEventMessage(text), names = { date: 'date', start: 'start time', end: 'end time', loc: 'location', addr: 'address', salary: 'salary', allowance: 'allowance' };
      for (const [key, value] of Object.entries(fields)) $(key).value = value;
      $('day').textContent = dayName($('date').value); updateEventTotal();
      const found = Object.keys(fields), missing = Object.keys(names).filter(k => !(k in fields));
      $('pasteResult').textContent = found.length ? 'Filled ' + found.map(k => names[k]).join(', ') + '. ' + (missing.length ? 'Check or enter ' + missing.map(k => names[k]).join(', ') + '. ' : '') + 'Review all fields, then save.' : 'Could not identify event details. Please enter the fields manually.';
    });

    /* add / edit */
    function openForm(e) {
      $('pasteInfo').value = '';
      $('pasteResult').textContent = 'Fields fill automatically. Review them before saving.';
      editId = e ? e.id : null;
      $('ftitle').textContent = e ? 'Edit event' : 'Add event';
      $('date').value = e ? e.date : today();
      $('start').value = e ? e.start : '';
      $('end').value = e ? e.end : '';
      $('salary').value = e ? e.salary : '';
      $('allowance').value = e ? (e.allowance || 0) : 0;
      $('ot').value = e ? (e.ot || 0) : 0;
      $('parking').value = e ? (e.parking || 0) : 0;
      updateEventTotal();
      $('loc').value = e ? e.loc : '';
      $('addr').value = e ? e.addr : '';
      $('day').textContent = dayName($('date').value);
      $('form').showModal();
    }
    $('date').addEventListener('input', () => $('day').textContent = dayName($('date').value));
    $('f').addEventListener('submit', ev => {
      const data = { date: $('date').value, start: $('start').value, end: $('end').value, salary: parseFloat($('salary').value), allowance: parseFloat($('allowance').value || '0'), ot: parseFloat($('ot').value || '0'), parking: parseFloat($('parking').value || '0'), loc: $('loc').value.trim(), addr: $('addr').value.trim() };
      if (editId) { const i = events.findIndex(x => x.id === editId); events[i] = { ...events[i], ...data }; }
      else events.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), paid: null, ...data });
      save(); render();
    });
    $('cancel').onclick = () => $('form').close();
    $('add').onclick = () => openForm();

    /* Single and combined receipts, stored as incremental payments. */
    function paymentItems() { return paymentIds.map(id => events.find(e => e.id === id)).filter(Boolean); }
    function openPayment(ids) {
      const expanded = new Set();
      ids.forEach(id => { const e = events.find(x => x.id === id); if (e && balance(e) > 0) members(e).forEach(x => expanded.add(x.id)); });
      paymentIds = [...expanded];
      const items = paymentItems(), units = uniqueUnits(items); if (!items.length) return;
      $('pinfo').textContent = items.length + ' event(s) · Expected ' + rm(items.reduce((n, e) => n + totalPay(e), 0)) + ' · Already received ' + rm(units.reduce((n, e) => n + received(e), 0)) + ' · Remaining ' + rm(sumBalances(items));
      $('pdate').value = today(); $('pamt').value = '';
      $('allocations').innerHTML = items.map(e => `<div class="meta">${esc(e.loc)} · ${fmtDate(e.date)} · Expected ${rm(totalPay(e))}</div>`).join('') + (items.length > 1 ? '<p class="dayhint">One shared balance for these events. Payments are not split between events. Selecting an existing group includes all its events.</p>' : '');
      checkAmt(); $('payd').showModal();
    }
    function checkAmt() {
      const v = Number($('pamt').value), due = cents(sumBalances(paymentItems()));
      $('pcheck').textContent = !$('pamt').value ? 'Enter the exact amount the company transferred this time.' : cents(v) < due ? 'Company will still owe ' + rm((due - cents(v)) / 100) + ' for this payment group, counted once on the dashboard.' : cents(v) === due ? 'This clears the selected balance. All events will be marked paid in full.' : 'Extra payment: ' + rm((cents(v) - due) / 100) + '. Please check the amount.';
    }
    $('pamt').addEventListener('input', checkAmt);
    function recordReceipt(items, amount, date) {
      const units = uniqueUnits(items), previous = units.flatMap(e => payments(e));
      const g = { id: units.length === 1 && groupOf(units[0]) ? groupOf(units[0]).id : 'group:' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8), payments: [...previous, { amount: cents(amount) / 100, date }] };
      if (items.length > 1) items.forEach(e => { e.paymentGroup = g; });
      else { items[0].payments = g.payments; items[0].paid = { amount: g.payments.reduce((n, p) => n + cents(p.amount), 0) / 100, date }; }
    }
    $('pf').addEventListener('submit', ev => {
      ev.preventDefault();
      const items = paymentItems(), value = Number($('pamt').value);
      if (!Number.isFinite(value) || cents(value) <= 0 || !items.length || !$('pdate').value) { alert('Enter a valid payment amount and date.'); return; }
      recordReceipt(items, value, $('pdate').value);
      selectedEvents.clear(); save(); $('payd').close(); render();
    });
    $('pcancel').onclick = () => $('payd').close();
    $('list').addEventListener('change', ev => { const id = ev.target.dataset.select; if (id) { const e = events.find(x => x.id === id); if (e) selectUnit(e, ev.target.checked); render(); } });

    /* list actions */
    $('list').addEventListener('click', ev => {
      const b = ev.target.closest('button[data-a]'); if (!b) return;
      const e = events.find(x => x.id === b.dataset.id), a = b.dataset.a;
      if (a === 'edit') openForm(e);
      if (a === 'del' && groupOf(e)) { alert('This event belongs to a shared payment group. Keep it to preserve the group payment and balance history.'); return; }
      if (a === 'del' && confirm('Delete this event?')) { events = events.filter(x => x.id !== e.id); save(); render(); }
      if (a === 'pay') openPayment([e.id]);
    });
    $('tabs').addEventListener('click', ev => { const b = ev.target.closest('button[data-f]'); if (b) { filter = b.dataset.f; render(); } });

    /* backup */
    $('exp').onclick = () => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([JSON.stringify(events, null, 2)], { type: 'application/json' }));
      a.download = 'event-pay-backup-' + today() + '.json'; a.click();
    };
    $('imp').onclick = () => $('file').click();
    $('file').onchange = async () => {
      try {
        const d = JSON.parse(await $('file').files[0].text());
        if (!Array.isArray(d)) throw 0;
        if (confirm('Replace current data with ' + d.length + ' events from this backup?')) { events = d; save(); render(); }
      } catch (e) { alert('That file is not a valid backup.'); }
      $('file').value = '';
    };

    render();
    setInterval(render, 60000);
  </script>
</body>

</html>
